name: pypi-publish
# The ONLY way a hugpy-* distribution reaches PyPI (never `twine upload` by hand).
#
# A release is a workspace tag:  ./release.sh X.Y.Z  (see CONSISTENCY.md). The
# tag vX.Y.Z is the single source of the version: setuptools-scm turns it into
# X.Y.Z in every in-tree pyproject at build time, so this workflow never edits a
# version and refuses to publish if any built artifact disagrees with the tag.
#
# Which distributions: every [[package]] in py/partition.toml, in cut order,
# derived at run time. Adding a package to the manifest is enough; this file
# needs no edit. [[external_package]] entries (hugpy-agent, abstract-identity,
# ...) release from their own repositories and py/compat/abstract_hugpy_dev is
# a dev-only alias shell that is NEVER published (ECOSYSTEM.md D.4).
#
# One-time PyPI setup (owner: putkoff), once per project name (DONE 2026-09-23):
#   1. On pypi.org, for each of the 14 names (hugpy, hugpy-platform, hugpy-tools,
#      hugpy-control, hugpy-storage, hugpy-engine, hugpy-media, hugpy-video,
#      hugpy-oracle, hugpy-fleet, hugpy-curation, hugpy-ops, hugpy-discord,
#      hugpy-server):
#      NOTE: hugpy-tools was added 2026-09-24 and is a NOT-YET-EXISTING name on
#      PyPI — it needs the one-time a0 bootstrap below before its trusted
#      publisher can be registered (PyPI keys pending publishers on
#      (owner, repo, workflow, environment), so only one pending name at a time).
#      Manage -> Publishing -> add a trusted publisher with
#        owner: hugpy   repository: hugpy   workflow: pypi-publish.yml   environment: pypi
#      The same publisher config is allowed on any number of EXISTING projects.
#      It is NOT allowed as a "pending publisher" for more than one not-yet-
#      existing name: PyPI keys pending publishers on (owner, repo, workflow,
#      environment) alone. A new name therefore has to exist before its
#      publisher can be added: bootstrap it once with a local-only tag
#      (`git tag v0.X.0a0`, `python -m build` the package, `twine upload` the
#      a0 placeholder with an account-scoped token, `git tag -d v0.X.0a0`),
#      then register the publisher on the project page. That upload is the
#      one exception to "never twine upload by hand"; the a0 pre-release is
#      ignored by pip and can be yanked.
#   2. On GitHub, create the `pypi` environment (Settings -> Environments) and
#      give it required reviewers; the publish job waits there for an explicit go.
#   3. Note on the name `hugpy`: it already exists on PyPI at 0.1.181 as the
#      retired monolith (same owner). The first partitioned release is 0.2.0,
#      which sorts above it and supersedes it; earlier releases are yanked per
#      ECOSYSTEM.md D.4 after the bridge period, never deleted.
#   No API tokens are stored anywhere: trusted publishing mints a short-lived
#   OIDC token per run (permissions: id-token: write below).
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: pypi-publish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # setuptools-scm derives every version from the workspace tags
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -U pip build twine
      - name: Build sdist + wheel for every [[package]] in py/partition.toml, verified against the tag
        # The same script a central box runs to publish a release on its own
        # index (py/build_wheels.py --publish); CI only adds PyPI at the end.
        run: python py/build_wheels.py --out dist --expect-tag "$GITHUB_REF_NAME"
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi # required reviewers live here; trusted publisher is bound to this name
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          name: hugpy ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
