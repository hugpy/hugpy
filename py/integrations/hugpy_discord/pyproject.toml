[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hugpy-discord"
dynamic = ["version"]
description = "Hugpy Discord: the Discord bot arm, an HTTP client of a Hugpy central with streaming replies and per-user preferences"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "putkoff", email = "support@hugpy.ai" }]
keywords = [
    "hugpy",
    "llm",
    "self-hosted",
    "discord",
    "discord-bot",
    "chatbot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "hugpy-platform",
    "httpx",
]

[project.urls]
Homepage = "https://hugpy.ai"
Documentation = "https://github.com/hugpy/hugpy/blob/main/py/integrations/hugpy_discord/README.md"
Repository = "https://github.com/hugpy/hugpy"
Source = "https://github.com/hugpy/hugpy/tree/main/py/integrations/hugpy_discord"
Issues = "https://github.com/hugpy/hugpy/issues"
Changelog = "https://github.com/hugpy/hugpy/releases"
Architecture = "https://github.com/hugpy/hugpy/blob/main/PARTITION.md"

[project.optional-dependencies]
bot = ["discord.py", "python-dotenv"]
test = ["pytest>=8"]

[project.scripts]
hugpy-bot = "hugpy_discord.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hugpy_discord = ["py.typed", "**/*.json", "**/*.sh", "**/*.md", "**/*.txt"]

# ---------------------------------------------------------------------------
# Lockstep workspace version (2026-09-22): every in-tree hugpy-* distribution
# takes ONE version from the workspace git tag (vX.Y.Z at the repo root), so a
# release is a tag and a build always carries the commit it came from
# (X.Y.Z.devN+g<sha>[.dirty] between tags). A checkout without git metadata
# builds as 0.0.0+unknown, which central refuses to advertise to workers.
[tool.setuptools_scm]
root = "../../.."
fallback_version = "0.0.0+unknown"
