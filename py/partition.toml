schema_version = 2
source_root = "../abstract_hugpy_dev/src/abstract_hugpy_dev"
monolith_import = "abstract_hugpy_dev"

# Dependency names below are package ids. They describe allowed Python import
# direction, not optional HTTP calls between independently deployed services.
#
# `moves` maps a monolith source path (relative to source_root) to its
# destination module path inside the package's import namespace. Directory
# entries move recursively and keep their internal layout. Every key in
# `moves` is an owned source root; the ordering of packages is the cut order.
#
# Revision 2 (2026-09-22) corrections against revision 1:
# - flask_app/app/functions/imports/utils is not server code. The central
#   worker registry, peers, enrollment tokens, pool guard, PID attribution and
#   phone-brick store are fleet-central state; hf_token is storage; the wire
#   schemas and manifest loader are engine catalog contracts; downloads
#   helpers are storage; media_extract is media.
# - engine depends on storage and control (it reads physical inventory,
#   metadata caches, job/settings stores). storage must NOT import engine.
#   reclassify/reconcile are catalog operations and therefore engine.
# - provisioner scans engine, studio and comfy registries: it is an operations
#   consumer (ops), not storage.
# - worker_agent/provision.py is model transfer (ensure_model_present) and
#   belongs to storage; model_sync rides on it.
# - comms/feeds.py materializes fleet rosters and is fleet. comms/__init__.py
#   is a re-export layer and is retired.
# - managers/task_deps.py is a task capability map consumed by fleet, oracle
#   and server; it is engine, not meta.
# - video_intel/runners/performance_relay.py and prompt_coordination.py are
#   Oracle orchestration and move to oracle, removing the video->oracle edge.
# - constants/categories.py is model-catalog domain and moves to engine.
#   constants/paths.py (on-disk model layout) and hugpy_marker.py (marker and
#   GGUF header reading) are physical-storage domain and move to storage;
#   spill.gguf_moe_detail must move down to storage with them.
# - Cross-package placement (engine, video, oracle, curation asking "which
#   worker") goes through hugpy_engine.placement protocols implemented by
#   fleet and wired by server.

