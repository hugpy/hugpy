# nginx for the hugpy-chat HF Space — a thin reverse-proxy MIRROR of
# dev.hugpy.ai/media (the media-intelligence arm). No bundled SPA: the UI and API
# both come live from dev, so the Space always reflects dev's current /media build
# with nothing to rebuild here. This is the ONLY public face of the keeper's
# private dev console (media-intelligence only), by design.
#
# The browser stays on the Space's own origin (so dev's CORS-less API is fine — the
# proxy calls it server-side) and simply lands at /media/. Container runs
# unprivileged on HF Spaces → pid + temp paths under /tmp, listen on 7860.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 7860;
        server_name _;

        # Emit RELATIVE redirects — the Space is fronted by HF's TLS proxy, so an
        # absolute redirect would leak the internal :7860/http and break in browsers.
        absolute_redirect off;

        client_max_body_size 25m;   # media uploads (doc/image/audio analyze)

        # Land visitors on the media arm.
        location = / { return 302 /media/; }

        # The media-intelligence SPA — proxied verbatim from dev (its build serves
        # its own /media/assets/* and the basename=/media router works as-is).
        location /media/ {
            proxy_pass            https://dev.hugpy.ai/media/;
            proxy_ssl_server_name on;
            proxy_set_header Host dev.hugpy.ai;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
        }

        # The hugpy API the arm calls (same-origin /api → dev). SSE streaming on
        # /api/chat/stream must not be buffered.
        location /api/ {
            proxy_pass            https://dev.hugpy.ai/api/;
            proxy_ssl_server_name on;
            proxy_set_header Host dev.hugpy.ai;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache     off;
            proxy_read_timeout 600s;
        }
    }
}
